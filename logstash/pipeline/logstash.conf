input {
  file {
    path => "/logs/auth.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => multiline {
      pattern => "^%{SYSLOGTIMESTAMP}"
      negate => true
      what => "previous"
    }
  }
}

filter {
  # Parse the basic syslog header into timestamp, hostname, program, pid and the rest of the message.  
  # This matches exactly what the Python regex captures and leaves the remainder of the log line in
  # the `log_message` field for further processing.
  grok {
    match => {
      "message" => "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{WORD:program}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:log_message}"
    }
  }

  # Handle lines indicating failed SSH password attempts.  
  # We support both the "invalid user" variant and the normal variant, and we do not require the
  # trailing protocol (ssh/ssh2) to be present.  This mirrors the Python regex behaviour which
  # simply stops matching after the port number.
  if [log_message] =~ /Failed password/ {
    grok {
      match => {
        # Try to match the "invalid user" pattern first. If it fails, fall back to the regular pattern.
        # The optional trailing protocol segment is captured into the `protocol` field when present but
        # does not affect the rest of the capture.
        "log_message" => [
          "Failed password for invalid user %{DATA:username} from %{IP:source_ip} port %{INT:port}(?: %{WORD:protocol})?",
          "Failed password for %{DATA:username} from %{IP:source_ip} port %{INT:port}(?: %{WORD:protocol})?"
        ]
      }
      # Overwrite any existing values from previous matches (e.g. when a fallback pattern is used).
      overwrite => ["username", "source_ip", "port", "protocol"]
    }
    mutate {
      add_tag => ["failed_ssh"]
    }
  }

  # Handle PAM authentication failure messages (e.g. from pam_unix).  
  # Extract the remote host (rhost) and optionally the user when it is present.  The use of
  # %{DATA:username} instead of %{USERNAME} ensures we behave like the Python regex which uses \S+
  # to capture any non-whitespace characters in the username.
  if [log_message] =~ /authentication failure/ {
    grok {
      match => {
        "log_message" => "authentication failure;.*rhost=%{IP:source_ip}(?:\s+user=%{DATA:username})?"
      }
      overwrite => ["source_ip", "username"]
    }
    mutate {
      add_tag => ["auth_failure"]
    }
  }

  # Handle lines that start with "Invalid user".  
  # These are logged by sshd when a connection attempts to authenticate as a non-existent user.
  # Python's regex treats these as a separate event type; we tag them as "invalid_user" for parity.
  if [log_message] =~ /^Invalid user/ {
    grok {
      match => {
        "log_message" => "Invalid user %{DATA:username} from %{IP:source_ip} port %{INT:port}"
      }
      overwrite => ["username", "source_ip", "port"]
    }
    mutate {
      add_tag => ["invalid_user"]
    }
  }

  # If we managed to extract a source IP, enrich the event with GeoIP data and parse the timestamp.
  # Otherwise, drop the event to avoid indexing unparsable lines.  This mirrors the Python logic
  # which returns None when an IP cannot be extracted.
  if [source_ip] {
    geoip {
      source   => "source_ip"
      target   => "geoip"
      database => "/usr/share/logstash/geoip/GeoLite2-Country.mmdb"
    }

    date {
      match    => ["timestamp", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss"]
      timezone => "America/Sao_Paulo"
      target   => "@timestamp"
    }
  } else {
    drop {}
  }
}

output {
  # Only index events that have a valid source IP.  
  # Use a daily index pattern similar to the original configuration.
  if [source_ip] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "ssh-failed-attempts-%{+YYYY.MM.dd}"
    }
  }
  # Always output to stdout with the rubydebug codec for debugging purposes.
  stdout {
    codec => rubydebug
  }
}