input {
  file {
    path => "/logs/auth.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => multiline {
      pattern => "^%{SYSLOGTIMESTAMP}"
      negate => true
      what => "previous"
    }
  }
}

filter {
  grok {
    match => {
      "message" => "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{WORD:program}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:log_message}"
    }
  }

  if [log_message] =~ /Failed password/ {
    grok {
      match => {
        "log_message" => "Failed password for (invalid user )?%{USERNAME:username} from %{IP:source_ip} port %{INT:port} ssh2"
      }
    }
    mutate { add_tag => ["failed_ssh"] }
  }

  if [log_message] =~ /authentication failure/ {
    grok {
      match => {
        "log_message" => "authentication failure;.*rhost=%{IP:source_ip}(\s+user=%{USERNAME:username})?"
      }
    }
    mutate { add_tag => ["auth_failure"] }
  }

  if [source_ip] {
    geoip {
      source => "source_ip"
      target => "geoip"
      database => "/usr/share/logstash/geoip/GeoLite2-Country.mmdb"
    }

    date {
      match => ["timestamp", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss"]
      timezone => "America/Sao_Paulo"
      target => "@timestamp"
    }
  } else {
    drop { }
  }
}

output {
  if [source_ip] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "ssh-failed-attempts-%{+YYYY.MM.dd}"
    }
  }
  stdout { codec => rubydebug }
}
